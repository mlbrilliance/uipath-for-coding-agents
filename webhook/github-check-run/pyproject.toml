[project]
name = "aurora-github-check-run-webhook"
version = "0.1.0"
description = "FastAPI webhook for GitHub check_run.completed → Maestro correlation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Three top-level modules (app, maestro_client, security) — disambiguate the
# flat layout for setuptools so `pip install -e .` succeeds.
[tool.setuptools]
py-modules = ["app", "maestro_client", "security"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
