[project]
name = "aurora-vuln-lookup"
version = "0.1.0"
description = "AURORA Coded Agent: cross-references lockfile dependencies against NVD, OSV, and GitHub Advisory; emits structured findings."
authors = [{ name = "AURORA Forger-Agent (autogen)", email = "puneetsatyawan@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "uipath>=2.10.0",
    "uipath-langchain>=0.5.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
