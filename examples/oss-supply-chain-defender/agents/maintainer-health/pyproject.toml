[project]
name = "aurora-maintainer-health"
version = "0.1.0"
description = "AURORA Coded Agent — OpenAI Agents framework. Computes maintainer health for lockfile dependencies via OpenSSF Scorecard and commit-recency signals."
authors = [{ name = "AURORA Forger-Agent (autogen)", email = "puneetsatyawan@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "uipath>=2.10.0",
    "uipath-openai-agents>=0.0.10",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
