[project]
name = "aurora-coding-agent"
version = "0.1.0"
description = "AURORA — autonomous UiPath RPA Operations & Reasoning Agency"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nick", email = "puneetsatyawan@gmail.com" }
]
keywords = ["uipath", "rpa", "agentic", "maestro", "swarm"]

dependencies = [
  # UiPath
  "uipath>=2.10.0",
  "uipath-langchain>=0.5.0",

  # Claude (subscription OAuth — no anthropic API key)
  "claude-agent-sdk>=0.1.80",

  # Agent runtimes for forger-agent
  "langgraph>=0.2.0",
  "langchain-anthropic>=0.3.0",

  # Core
  "pydantic>=2.6.0",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "structlog>=24.1.0",
  "rich>=13.7",
  "textual>=0.79",          # TUI dashboard
  "watchfiles>=0.21",

  # Memory + fingerprinting
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "scikit-learn>=1.4",       # kNN over fingerprints

  # MCP server
  "mcp>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-httpx>=0.30",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-PyYAML",
]

# Optional multi-model lanes (v2 — bonus criterion)
multi-model = [
  "uipath-llamaindex>=0.5.0",
  "uipath-openai-agents>=0.0.10",
  "openai>=1.30",
  "google-genai>=0.5.0",
]

[project.scripts]
aurora = "aurora.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/aurora"]

[tool.hatch.build]
sources = ["lib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]